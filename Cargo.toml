[workspace]
resolver = "2"
members = [
    "crates/tm-types",
    "crates/tm-graph",
    "crates/tm-vector",
    "crates/tm-episodic",
    "crates/tm-governance",
    "crates/tm-controller",
    "crates/tm-ingest",
    "crates/tm-retrieval",
    "crates/tm-mcp",
    "crates/tm-cli",
    "crates/tm-tauri",
    "crates/tm-capture",
    "crates/tm-rerank",
    "crates/tm-reason",
    "crates/tm-bench",
    "crates/tm-bench-context",
    "crates/tm-bench-triples",
    "crates/tm-answer",
    "crates/tm-bench-locomo",
    "crates/tm-intent",
    "crates/tm-reflect",
    "crates/tm-world-model",
    "crates/tm-temporal",
    "crates/tm-modal",
    "crates/tm-tms",
    "crates/tm-engram",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aaditya Srivathsan"]
license = "MIT"
repository = "https://github.com/aadi2vec/tracemind"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Error handling
anyhow = "1"
thiserror = "1"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-knowledge-graph = { version = "0.11.0", features = ["bundled"] }

# Embeddings
fastembed = "5"

# Hashing
seahash = "4"

# CLI
clap = { version = "4", features = ["derive"] }

# Workspace crates
tm-types = { path = "crates/tm-types" }
tm-graph = { path = "crates/tm-graph" }
tm-vector = { path = "crates/tm-vector" }
tm-episodic = { path = "crates/tm-episodic" }
tm-governance = { path = "crates/tm-governance" }
tm-controller = { path = "crates/tm-controller" }
tm-ingest = { path = "crates/tm-ingest" }
tm-retrieval = { path = "crates/tm-retrieval" }
tm-reason = { path = "crates/tm-reason" }
tm-answer = { path = "crates/tm-answer" }
tm-intent = { path = "crates/tm-intent" }
tm-reflect = { path = "crates/tm-reflect" }
tm-world-model = { path = "crates/tm-world-model" }
tm-temporal = { path = "crates/tm-temporal" }
tm-modal = { path = "crates/tm-modal" }
tm-tms = { path = "crates/tm-tms" }
tm-engram = { path = "crates/tm-engram" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
