services:

  # ── Neo4j (Symbolic Graph Store) ─────────────────────────────────────────
  neo4j:
    image: neo4j:5.15.0
    container_name: agent_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt connection
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:7474" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── ChromaDB (Vector Store) ───────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: agent_chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:8000/api/v1/heartbeat" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Agent (Multi-Agent AutoGen System) ───────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # These override any defaults in code when running inside Docker
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    stdin_open: true # keep stdin open for interactive CLI
    tty: true # allocate a pseudo-TTY
    depends_on:
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs # persist trace/episodic logs

# ── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  neo4j_data:
  neo4j_logs:
  chroma_data:
