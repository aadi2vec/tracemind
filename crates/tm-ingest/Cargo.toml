[package]
name = "tm-ingest"
version.workspace = true
edition.workspace = true

[dependencies]
tm-types = { workspace = true }
tm-graph = { workspace = true }
tm-vector = { workspace = true }  # for Embedder only
tm-governance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
seahash = { workspace = true }

# TM-NLP-004 — real GLiNER inference.
# Mandatory (no feature flag): ort is already transitively present via tm-rerank.
# Graceful offline fallback: GlinerExtractor::auto_download_or_none() returns None
# when the model/tokenizer can't be fetched, and callers drop back to
# HeuristicExtractor.
ort = { version = "=2.0.0-rc.10" }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = { version = "0.16" }
hf-hub = { version = "0.4" }

# LM-6 — optional Qwen 2.5 1.5B Q4 triple extractor. Behind `local-llm`
# feature; pulls llama-cpp-2 (heavy native build, ~30s cold compile) so
# default builds stay fast. The pure prompt/parser helpers in
# `crate::qwen` are always compiled and unit-tested without the model.
llama-cpp-2 = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Tier 1: Qwen 2.5 1.5B Q4_K_M relation extractor (opt-in, ~900 MB weights).
local-llm = ["dep:llama-cpp-2"]
# Apple Silicon Metal acceleration for the slow-path extractor.
local-llm-metal = ["local-llm", "llama-cpp-2/metal"]
