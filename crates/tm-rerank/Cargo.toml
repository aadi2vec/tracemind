[package]
name = "tm-rerank"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "ColBERT late-interaction reranker for TraceMind"

[dependencies]
tm-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

# ONNX Runtime for ColBERT inference (pinned to match fastembed's ort).
ort = { version = "=2.0.0-rc.10" }
# HuggingFace tokenizer for BPE tokenization.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# Tensor manipulation for ONNX inputs/outputs.
ndarray = { version = "0.16" }
# Model auto-download from HuggingFace Hub.
hf-hub = { version = "0.4" }

[dev-dependencies]
tempfile = "3"
