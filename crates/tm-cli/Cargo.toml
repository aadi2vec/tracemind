[package]
name = "tm-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tracemind"
path = "src/main.rs"

[dependencies]
tm-types = { workspace = true }
tm-graph = { workspace = true }
tm-ingest = { workspace = true }
tm-retrieval = { workspace = true }
tm-episodic = { workspace = true }
tm-controller = { workspace = true }
tm-rerank = { path = "../tm-rerank" }
tm-answer = { workspace = true }
tm-intent = { workspace = true }
tm-reflect = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[features]
default = []
# Enable Tier-1 local LLM answers (Qwen 2.5 1.5B Q4 GGUF, ~900 MB first-run download).
local-llm = ["tm-answer/local-llm"]
local-llm-metal = ["tm-answer/local-llm-metal"]
