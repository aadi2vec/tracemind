[package]
name = "tm-tauri"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "tracemind-app"
path = "src/main.rs"

[dependencies]
tm-types = { workspace = true }
tm-graph = { workspace = true }
tm-ingest = { workspace = true }
tm-retrieval = { workspace = true }
tm-episodic = { workspace = true }
tm-controller = { workspace = true }
tm-reason = { workspace = true }
tm-reflect = { workspace = true }
tm-cluster = { workspace = true }
tm-intent = { workspace = true }
tm-pgm = { workspace = true }
# Optional: Qwen 2.5 1.5B Q4 via llama-cpp for LLM-generated community
# labels. Gated by the `local-llm` feature so the heuristic-only build
# (the one used for fast iteration / CI) doesn't pull in cmake.
tm-answer = { workspace = true, optional = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
seahash = "4"

tauri = { version = "2", features = ["devtools"] }
tauri-build = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Tauri 2 only embeds `frontendDist` into the binary when the `custom-protocol`
# feature is on. Without it, even `cargo build --release` produces a binary
# that loads from `devUrl` (http://localhost:3000) and shows a blank webview
# unless Vite is running. We default-enable it so plain `cargo build --release`
# produces a working desktop binary. For `cargo run` against the Vite dev
# server, use `--no-default-features`.
default = ["custom-protocol", "local-llm"]
custom-protocol = ["tauri/custom-protocol"]
# Build with the Qwen 2.5 1.5B Q4_K_M extractor wired into the slow-path
# triple worker. Requires `cmake` (for llama-cpp-sys-2) at build time.
# Disable with `--no-default-features --features custom-protocol` to fall
# back to the heuristic extractor only (no cmake / no LLM weights).
# Runtime fallback to heuristic also kicks in automatically when the GGUF
# weights are missing — see `TripleWorker::spawn_qwen_or_default`.
local-llm = ["dep:tm-answer", "tm-answer/local-llm"]
