[package]
name = "tm-bench-locomo"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tm-bench-locomo"
path = "src/main.rs"

[lib]
name = "tm_bench_locomo"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"
tokio = { workspace = true }
uuid = { workspace = true }
tempfile = "3"

# Optional: real TraceMind runner that exercises ingest + retrieval.
tm-types = { workspace = true, optional = true }
tm-ingest = { workspace = true, optional = true }
tm-retrieval = { workspace = true, optional = true }

[features]
default = []
# Enable the real TraceMind runner. Pulls in tm-ingest + tm-retrieval which
# transitively bring fastembed; build is heavier but the runner produces
# publishable LoCoMo numbers against the actual stack.
tracemind = ["dep:tm-types", "dep:tm-ingest", "dep:tm-retrieval"]
