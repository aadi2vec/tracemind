[package]
name = "tm-bench-wme"
version.workspace = true
edition.workspace = true
authors.workspace = true

# WME-8..10 — Working Memory Engine guardrail bench.
#
# Three gates, each emit JSON + non-zero exit on failure:
#   • useful-rate   (≥ 0.60 on synthetic acceptance policy)
#   • anti-spam cap (≤ 8 cards/hour even under a 1000-event flood)
#   • per-tick p95  (< 50 ms across 1000 ticks)
#
# This is the falsifiability harness for the P4 WME claim.

[[bin]]
name = "tm-bench-wme"
path = "src/main.rs"

[dependencies]
tm-reflect = { workspace = true }
tm-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tempfile = "3"
